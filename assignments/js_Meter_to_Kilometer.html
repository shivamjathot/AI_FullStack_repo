<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meter to Kilometer</title>
</head>

<body>
    <label>Enter distance in meters:</label>
    <input type="number" id="meters" placeholder="Enter meters">
    <button onclick="convertDistance()">Convert</button>

    <h3 id="result"></h3>

    <script>
        const convertDistance = () => {
            let meters = Number(document.getElementById("meters").value);
            let kilometers = meters / 1000;

            document.getElementById("result").innerHTML =
                meters + " meters is " + kilometers + " kilometers";
        }
    </script>
</body>
</html>
