<body>

    <script>
// 2. Power: 2⁵ without Math.pow() or **
let base = 2;
let exponent = 5;
let result = 1;
let i = 1;

while (i <= exponent) {
  result *= base;
  i++;
}

console.log(result); // 32

    </script>
    
</body>
