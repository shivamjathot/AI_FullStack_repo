 <script>


// 1. Factorial: 5! = 120
let num = 5;
let factorial = 1;
let i = 1;

while (i <= num) {
  factorial *= i;
  i++;
}

console.log(`Factorial of ${num} is ${factorial}`); // 120



// 2. Power: 2⁵ without Math.pow() or **
let base = 2;
let exponent = 5;
let result = 1;
let i = 1;

while (i <= exponent) {
  result *= base;
  i++;
}

console.log(result); // 32
